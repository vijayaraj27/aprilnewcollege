<svg xmlns="http://www.w3.org/2000/svg" width="360" height="450" viewBox="0 0 360 450" role="img" aria-label="Default faculty photo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EEF3F7"/>
      <stop offset="100%" stop-color="#D9E3EC"/>
    </linearGradient>
    <linearGradient id="person" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9AA8B6"/>
      <stop offset="100%" stop-color="#7E8D9C"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1f2a37" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="360" height="450" rx="18" fill="url(#bg)"/>

  <!-- soft ring -->
  <circle cx="180" cy="188" r="108" fill="#FFFFFF" opacity="0.55"/>
  <circle cx="180" cy="188" r="96" fill="#F7FAFC" stroke="#C9D5E0" stroke-width="2"/>

  <!-- person silhouette -->
  <g filter="url(#soft)">
    <circle cx="180" cy="156" r="46" fill="url(#person)"/>
    <path d="M78 318c18-70 62-104 102-104s84 34 102 104v36H78v-36z" fill="url(#person)"/>
  </g>

  <!-- subtle camera badge -->
  <g transform="translate(236 246)">
    <circle cx="24" cy="24" r="22" fill="#FFFFFF" stroke="#C9D5E0" stroke-width="2"/>
    <rect x="12" y="18" width="24" height="16" rx="3" fill="#A3B1BF"/>
    <circle cx="24" cy="26" r="5.5" fill="#EEF3F7" stroke="#7E8D9C" stroke-width="2"/>
    <rect x="28" y="14" width="6" height="4" rx="1" fill="#A3B1BF"/>
  </g>
</svg>
